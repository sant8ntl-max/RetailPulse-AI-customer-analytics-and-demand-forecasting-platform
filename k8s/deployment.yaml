apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailpulse-dashboard
  labels: {app: retailpulse}
spec:
  replicas: 2
  selector:
    matchLabels: {app: retailpulse}
  template:
    metadata:
      labels: {app: retailpulse}
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/YOUR_GITHUB_USERNAME/retailpulse:latest   # change after you push the image
          ports: [{containerPort: 8501}]
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: retailpulse-service
spec:
  selector: {app: retailpulse}
  ports: [{port: 80, targetPort: 8501}]
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retailpulse-ingress
  annotations: {nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"}
spec:
  rules:
    - host: retailpulse.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: retailpulse-service, port: {number: 80}}
